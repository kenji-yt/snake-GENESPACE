# Used for: parsing annotations (AGAT), building MCScanX and running GENESPACE with OrthoFinder
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - gxx=14.4.0
  - openjdk=25.0.2
  - binutils=2.46.1
  - git=2.56.0
  - r-base=4.4.3
  - perl=5.32.1
  - python=3.14.10
  - numpy=2.3.5 # OrthoFinder 2.5.5 fails with numpy 2.4 and later
  - orthofinder=2.5.5 # GENESPACE does not recognise OrthoFinder 3
  - diamond=2.2.8
  - agat=1.6.1 # AGAT 1.7.0 crashes on large annotations ("progress bar already finished")
  - fastx_toolkit=0.0.14
  - gawk=5.4.1
  - r-remotes=2.5.0
  - bioconductor-biostrings=2.74.0
  - bioconductor-rtracklayer=1.66.0
  - make=4.4.1
  - r-mass=7.3_66
  - r-ggplot2=4.0.3
  - r-r.utils=2.13.0
  - r-generics=0.1.4
  - r-igraph=2.3.4
  - r-dbscan=1.2.6 # 1.2.7 rejects minPts = 0, which GENESPACE uses
  - r-data.table=1.18.6.1
  - sed=4.10
